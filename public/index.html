<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0E10">
  <!-- Don't send this page's address to image/music hosts (privacy, and some refuse it) -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="ProjectMusic — a free, lightweight, open-source music player for the web.">
  <title>ProjectMusic</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/touch-icon.png">
  <link rel="preload" href="fonts/DMSans-500.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside id="side" class="side" aria-label="Sidebar"></aside>
    <main id="view" class="view" tabindex="-1"></main>
    <aside id="panel" class="panel" aria-label="Queue and lyrics"></aside>
  </div>

  <div id="mini" class="mini" aria-label="Mini player"></div>
  <div id="bar" class="bar" aria-label="Player"></div>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <section id="np" class="np" hidden aria-label="Now playing"></section>
  <div id="sheet-root" class="sheet-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drop" class="drop" aria-hidden="true"></div>
  <input id="file-input" type="file" accept="audio/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
